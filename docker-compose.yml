services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel13_blog_system
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    ports:
      - "8000:8000"
      - "5173:5173"
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=sqlite
    networks:
      - blog-network

networks:
  blog-network:
    driver: bridge
