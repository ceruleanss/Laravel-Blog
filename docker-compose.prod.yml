services:
  app:
    image: ${APP_IMAGE:-blog_app_prod:latest}
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: blog_app_prod
    restart: always
    env_file:
      - .env
    volumes:
      - sqlite_data:/var/www/html/database
      - storage_data:/var/www/html/storage/app/public
    networks:
      - blog_network

  web:
    image: ${WEB_IMAGE:-blog_web_prod:latest}
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    container_name: blog_web_prod
    restart: always
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - storage_data:/var/www/html/public/storage:ro
    depends_on:
      - app
    networks:
      - blog_network

volumes:
  sqlite_data:
    name: blog_sqlite_data
  storage_data:
    name: blog_storage_data

networks:
  blog_network:
    name: blog_network
    driver: bridge
